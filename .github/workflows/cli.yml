name: CLI tests

on:
  push:
    branches: [main]
    paths: ['cli/**', 'skills/**', 'site/public/install.*', '.github/workflows/cli.yml']
  pull_request:
    paths: ['cli/**', 'skills/**', 'site/public/install.*', '.github/workflows/cli.yml']

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: cli }
      - run: cargo test --manifest-path cli/Cargo.toml
  shellcheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck -s sh site/public/install.sh
