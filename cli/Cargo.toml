[package]
name = "pgbx"
version = "0.5.0"
edition = "2021"
description = "CLI for pgbx: per-database backups from SQL, diagnosis when Postgres is down, restore from S3 onto a new server"

# standalone: not part of the pgrx extension crate in the parent directory
[workspace]

[[bin]]
name = "pgbx"
path = "src/main.rs"

[dependencies]
postgres = "0.19"
serde_json = "1"
rust-s3 = { version = "0.37", default-features = false, features = ["sync-rustls-tls"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# TLS to Postgres (libpq sslmode): the same rustls 0.23 + aws-lc-rs that rust-s3 already pulls in, so no OpenSSL and
# static musl builds stay as they are. tokio-postgres-rustls plugs it into the sync postgres crate (with channel binding);
# the roots for verify-ca/verify-full are webpki-roots (also already in the tree) plus the OS store.
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "aws_lc_rs"] }
tokio-postgres-rustls = "0.14"
webpki-roots = "1"
rustls-native-certs = "0.8"
# config.yaml (ADR 0003). serde_norway is the maintained fork of serde_yaml 0.9 (deprecated), same API: it reads and
# writes straight into serde_json::Value, so pgbx needs no serde derive and no YAML code of its own.
serde_norway = "0.9"

# adapter process groups and Ctrl-C (ADR 0003): both crates are already in the tree (socket2, mio), so no new code
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Console", "Win32_Security"] }

[profile.release]
opt-level = 3
