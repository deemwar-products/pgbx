name: CLI tests

on:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # macOS on our own Mac; Windows is covered by the release cross-build + install-test on our VM
        host: [ubuntu-24.04, pgbx-mac]
    runs-on: ${{ matrix.host == 'pgbx-mac' && fromJSON('["self-hosted","pgbx-mac"]') || matrix.host }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: cli }
      - run: cargo test --manifest-path cli/Cargo.toml
  shellcheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck -s sh site/public/install.sh
