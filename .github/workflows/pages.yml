name: Docs site (Cloudflare Pages)

# Manual only. Builds the Astro docs site (with the installers in site/public) and deploys it to the Cloudflare Pages
# project `pgbx`, served at https://pgbx.deemwar.com. Secrets: CLOUDFLARE_API_TOKEN (Pages edit) and
# CLOUDFLARE_ACCOUNT_ID. Locally the same deploy is: cd site && npm run build && npx wrangler pages deploy dist --project-name pgbx --branch main
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Build
        working-directory: site
        env:
          PUBLIC_SITE_URL: https://pgbx.deemwar.com
          PUBLIC_BASE_PATH: /
        run: npm ci && npm run build
      - name: Deploy to Cloudflare Pages
        working-directory: site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler@4 pages deploy dist --project-name pgbx --branch main --commit-hash "$GITHUB_SHA"
