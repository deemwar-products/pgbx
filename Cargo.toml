[package]
name = "pgbx"
version = "0.6.1"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[features]
default = ["pg16"]
pg13 = ["pgrx/pg13", "pgrx-tests/pg13" ]
pg14 = ["pgrx/pg14", "pgrx-tests/pg14" ]
pg15 = ["pgrx/pg15", "pgrx-tests/pg15" ]
pg16 = ["pgrx/pg16", "pgrx-tests/pg16" ]
pg17 = ["pgrx/pg17", "pgrx-tests/pg17" ]
pg18 = ["pgrx/pg18", "pgrx-tests/pg18" ]
pg19 = ["pgrx/pg19", "pgrx-tests/pg19" ]
pg_test = []

[dependencies]
pgrx = "=0.19.3"
postgres = "0.19"
libc = "0.2"
rust-s3 = { version = "0.37", default-features = false, features = ["sync-rustls-tls"] }
croner = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
miniz_oxide = "0.8"
# 0.6: client-side encryption, roles file (zstd), notifications (HTTP + SMTP)
ring = "0.17"
zstd = { version = "0.13", default-features = false }
ureq = { version = "2", default-features = false, features = ["tls"] }
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "builder", "rustls-tls"] }
# 0.6: S3 credentials from the instance role (IMDSv2) / container / web identity (src/s3auth.rs): both crates are
# already in the tree (attohttpc is rust-s3's HTTP client, serde_json comes with pgrx), so nothing new is pulled in
attohttpc = { version = "0.30", default-features = false }
serde_json = "1"
# rustls 0.23 refuses to pick a crypto provider when the build enables two (aws-lc-rs via rust-s3, ring via
# ureq/lettre): pgbx installs aws-lc-rs explicitly at load time (crypto_provider() in lib.rs). Same crate rust-s3 uses.
rustls = { version = "0.23", default-features = false, features = ["std", "aws_lc_rs"] }

[dev-dependencies]
[dev-dependencies.pgrx-tests]
version = "=0.19.3"

[profile.dev]
panic = "unwind"

[profile.release]
panic = "unwind"
opt-level = 3
lto = "fat"
codegen-units = 1
