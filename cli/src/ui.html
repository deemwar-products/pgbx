<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pgbx audit</title>
<style>
:root{--bg:#f7f7f5;--card:#fff;--fg:#1d1f22;--mute:#666b73;--line:#e3e3df;--ok:#1f8a4c;--warn:#b7791f;--bad:#c53030;--info:#2b6cb0;--chip:#eef0f2}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#121417;--card:#1b1e23;--fg:#e6e8eb;--mute:#9aa1ab;--line:#2c3138;--ok:#48bb78;--warn:#ecc94b;--bad:#fc8181;--info:#63b3ed;--chip:#262a31}}
:root[data-theme=dark]{--bg:#121417;--card:#1b1e23;--fg:#e6e8eb;--mute:#9aa1ab;--line:#2c3138;--ok:#48bb78;--warn:#ecc94b;--bad:#fc8181;--info:#63b3ed;--chip:#262a31}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--card);position:sticky;top:0;z-index:1}
header h1{font-size:16px;margin:0}
.ro{font-size:12px;color:var(--mute)}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav a{padding:6px 10px;border-radius:6px;color:var(--fg);text-decoration:none}
nav a.on{background:var(--chip);font-weight:600}
#theme{margin-left:auto;background:none;border:1px solid var(--line);color:var(--fg);border-radius:6px;padding:4px 8px;cursor:pointer}
main{padding:16px;max-width:1300px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin-bottom:14px}
h2{font-size:15px;margin:0 0 8px}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top;white-space:nowrap}
td.wrap{white-space:normal;min-width:220px}
th{font-size:12px;color:var(--mute);font-weight:600}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;background:var(--mute)}
.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}.info{color:var(--info)}
.dot.ok{background:var(--ok)}.dot.warn{background:var(--warn)}.dot.bad{background:var(--bad)}.dot.info{background:var(--info)}
.mute{color:var(--mute)}
.chip{display:inline-block;padding:1px 7px;border-radius:10px;background:var(--chip);font-size:12px}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
select{background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:4px 6px}
.big{font-size:15px;font-weight:600}
code{font-size:12px;word-break:break-all}
a.db{color:var(--info);cursor:pointer;text-decoration:none}
</style>
</head>
<body>
<header>
  <h1>pgbx audit</h1><span class="ro" id="who">read-only</span>
  <nav>
    <a href="#overview" data-v="overview">Overview</a>
    <a href="#timeline" data-v="timeline">Timeline</a>
    <a href="#health" data-v="health">Health</a>
  </nav>
  <button id="theme" type="button" title="toggle theme">theme</button>
</header>
<main id="main"><div class="card mute">loading…</div></main>
<script>
"use strict";
const $ = s => document.querySelector(s);
const esc = v => v == null ? "" : String(v).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ts = v => v ? esc(String(v).replace("T", " ").replace(/\.\d+/, "").replace(/\+00:00$/, "Z")) : "<span class=mute>—</span>";
const ago = v => { if (!v) return ""; const s = (Date.now() - Date.parse(v)) / 1000; if (isNaN(s)) return "";
  const a = Math.abs(s), f = a < 3600 ? Math.round(a/60) + " min" : a < 172800 ? Math.round(a/3600) + " h" : Math.round(a/86400) + " d";
  return s >= 0 ? f + " ago" : "in " + f; };
function tone(s) { s = String(s || "").toLowerCase();
  if (/fail|error|problem|overdue|open|never|worker error/.test(s)) return "bad";
  if (/pause|inactive|running|queued|starting|expired/.test(s)) return "warn";
  if (/ok|done|backed|healthy|closed|scheduled|idle/.test(s)) return "ok";
  return "info"; }
const st = s => `<span class="dot ${tone(s)}"></span>${esc(s)}`;
async function get(u) { const r = await fetch(u, {method: "GET", headers: {"Accept": "application/json"}});
  const j = await r.json(); if (!j.ok) throw new Error(j.error || r.status); return j; }
const fail = e => `<div class="card bad">${esc(e.message || e)}</div>`;
function table(cols, rows, empty) {
  if (!rows.length) return `<p class="mute">${empty || "nothing yet"}</p>`;
  return `<div class="scroll"><table><thead><tr>${cols.map(c => `<th>${esc(c[0])}</th>`).join("")}</tr></thead><tbody>` +
    rows.map(r => `<tr>${cols.map(c => `<td${c[2] ? ' class="wrap"' : ""}>${c[1](r)}</td>`).join("")}</tr>`).join("") + "</tbody></table></div>";
}

async function overview() {
  const j = await get("/api/overview");
  $("#who").textContent = `read-only · role ${j.connection.role} · ${j.connection.server_name || ""}`;
  return `<div class="card"><h2>Every database (${j.databases.length})</h2>` + table([
    ["database", r => `<a class="db" href="#db/${encodeURIComponent(r.database)}">${esc(r.database)}</a>`],
    ["state", r => st(r.state)], ["schedule", r => esc(r.schedule)],
    ["last backup", r => `${ts(r.last_backup_at)} <span class=mute>${ago(r.last_backup_at)}</span>`],
    ["next", r => ts(r.next_backup_at)], ["size", r => esc(r.last_backup_size)], ["kept", r => esc(r.backups_kept)],
    ["last restore test", r => r.last_verify ? st(r.last_verify) : "<span class=mute>never</span>", 1],
    ["last error", r => r.last_error ? `<span class=bad>${esc(r.last_error)}</span>` : "", 1],
  ], j.databases, "no databases reported yet (the worker publishes them every poll)") + "</div>";
}

const histCols = withDb => [
  ["when", r => `${ts(r.at)} <span class=mute>${ago(r.at)}</span>`],
  ...(withDb ? [["database", r => `<a class="db" href="#db/${encodeURIComponent(r.database)}">${esc(r.database)}</a>`]] : []),
  ["kind", r => `<span class=chip>${esc(r.kind)}</span>`], ["state", r => st(r.state)],
  ["who", r => esc(r.who)], ["trigger", r => esc(r.trigger)],
  ["what", r => what(r), 1],
];
function what(r) {
  const p = r.params || {}, bits = [];
  if (r.s3_key) bits.push(`<code>${esc(r.s3_key)}</code>`);
  if (r.bytes) bits.push(esc(fmtBytes(r.bytes)));
  if (r.kind === "download_url") bits.push(`link issued for <code>${esc(p.download_url)}</code>, expires ${esc(p.expires)}`);
  else { const q = Object.entries(p).filter(([k]) => k !== "by").map(([k, v]) => `${esc(k)}=${esc(typeof v === "object" ? JSON.stringify(v) : v)}`);
         if (q.length) bits.push(`<span class=mute>${q.join(" · ")}</span>`); }
  if (r.error) bits.push(`<span class=bad>${esc(r.error)}</span>`);
  return bits.join("<br>");
}
const fmtBytes = b => { const u = ["B","KB","MB","GB","TB"]; let i = 0; b = +b; while (b >= 1024 && i < 4) { b /= 1024; i++; } return b.toFixed(i ? 1 : 0) + " " + u[i]; };

let tl = null;
async function timeline() {
  tl = await get("/api/timeline?days=30");
  const uniq = k => [...new Set(tl.rows.map(r => r[k]))].sort();
  const sel = (id, k) => `<select id="${id}"><option value="">all ${k}s</option>${uniq(k).map(v => `<option>${esc(v)}</option>`).join("")}</select>`;
  setTimeout(() => ["fdb", "fkind", "fstate"].forEach(i => $("#" + i).onchange = drawTl), 0);
  return `<div class="card"><h2>Last ${tl.days} days — every action, newest first</h2>
    <div class="filters">${sel("fdb", "database")}${sel("fkind", "kind")}${sel("fstate", "state")}<span class="mute" id="tlcount"></span></div>
    ${tl.errors.length ? `<p class=warn>not readable: ${tl.errors.map(e => esc(e.database + ": " + e.error)).join("; ")}</p>` : ""}
    ${tl.truncated ? "<p class=warn>showing the newest 5000 rows</p>" : ""}
    <div id="tlrows"></div></div>`;
}
function drawTl() {
  const f = {database: $("#fdb").value, kind: $("#fkind").value, state: $("#fstate").value};
  const rows = tl.rows.filter(r => Object.entries(f).every(([k, v]) => !v || r[k] === v));
  $("#tlcount").textContent = `${rows.length} of ${tl.rows.length}`;
  $("#tlrows").innerHTML = table(histCols(true), rows, "no history in this window");
}

async function health() {
  const j = await get("/api/health");
  return `<div class="card"><h2 class="${j.healthy ? "ok" : "bad"}">${j.healthy ? "healthy" : "NOT healthy"}</h2>` + table([
    ["check", r => `<span class="dot ${r.ok ? "ok" : "bad"}"></span>${esc(r.name)}`],
    ["detail", r => esc(r.detail), 1], ["fix (shown only — run it yourself)", r => r.fix ? `<code>${esc(r.fix)}</code>` : "", 1],
  ], j.checks) + "</div>";
}

async function db(name) {
  const j = await get("/api/db/" + encodeURIComponent(name)), s = j.status || {};
  return `<div class="card"><h2>${esc(name)}</h2><p class="big">${st(s.state)}</p>
      <div class="scroll"><table><tbody>${Object.entries(s).map(([k, v]) => `<tr><th>${esc(k)}</th><td class=wrap>${esc(typeof v === "object" && v ? JSON.stringify(v) : v)}</td></tr>`).join("")}</tbody></table></div></div>
    <div class="card"><h2>Backups kept (${j.backups.length})</h2>` + table([
      ["id", r => esc(r.id)], ["taken", r => ts(r.taken_at)], ["age", r => esc(r.age)], ["trigger", r => esc(r.trigger)],
      ["size", r => esc(r.size)], ["s3 key", r => `<code>${esc(r.s3_key)}</code>`],
    ], j.backups) + `</div><div class="card"><h2>History</h2>` + table(histCols(false), j.history) + "</div>";
}

const views = {overview, timeline, health};
async function show() {
  const h = location.hash.slice(1) || "overview", [v, arg] = h.split(/\/(.*)/s);
  document.querySelectorAll("nav a").forEach(a => a.classList.toggle("on", a.dataset.v === v));
  try {
    $("#main").innerHTML = v === "db" ? await db(decodeURIComponent(arg || "")) : await (views[v] || overview)();
    if (v === "timeline") drawTl();
  } catch (e) { $("#main").innerHTML = fail(e); }
}
window.addEventListener("hashchange", show);
const root = document.documentElement;
try { const t = localStorage.getItem("pgbx-theme"); if (t) root.dataset.theme = t; } catch (e) {}
$("#theme").onclick = () => {
  const dark = root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  root.dataset.theme = dark ? "light" : "dark";
  try { localStorage.setItem("pgbx-theme", root.dataset.theme); } catch (e) {}
};
show();
setInterval(() => { if (!/^#(timeline|db)/.test(location.hash)) show(); }, 60000);
</script>
</body>
</html>
