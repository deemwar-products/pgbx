name: Old docs address (GitHub Pages redirect)

# Manual only. https://deemwar-products.github.io/pgbx/ was the docs site before https://pgbx.deemwar.com.
# This keeps it alive as a redirect: every page goes to the same path on pgbx.deemwar.com, and the installers
# (install.sh / install.ps1 / install.cmd) stay real files there, so old `curl .../install.sh | sh` lines keep working.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-redirect
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build the redirect site
        run: |
          mkdir -p out
          cp site/public/install.sh site/public/install.ps1 site/public/install.cmd out/
          cat > out/404.html <<'EOF'
          <!doctype html>
          <html lang="en"><head><meta charset="utf-8"><title>pgbx has moved</title>
          <meta name="robots" content="noindex">
          <script>
            // /pgbx/guides/encryption/ -> https://pgbx.deemwar.com/guides/encryption/
            var p = location.pathname.replace(/^\/pgbx(?=\/|$)/, '') || '/';
            location.replace('https://pgbx.deemwar.com' + p + location.search + location.hash);
          </script>
          <meta http-equiv="refresh" content="0; url=https://pgbx.deemwar.com/">
          <link rel="canonical" href="https://pgbx.deemwar.com/">
          </head><body><p>pgbx docs moved to <a href="https://pgbx.deemwar.com/">pgbx.deemwar.com</a>.</p></body></html>
          EOF
          cp out/404.html out/index.html
      - uses: actions/upload-pages-artifact@v3
        with: { path: out }
      - id: deployment
        uses: actions/deploy-pages@v4
