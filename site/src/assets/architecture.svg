<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 520" role="img" aria-label="A new database is created in Postgres, where pgbx lives. pgbx backs it up to S3. SQL restores it under a new name. If the server is down, the CLI reads S3 and restores to that same new name.">
  <defs>
    <radialGradient id="hubglow" cx="50%" cy="50%" r="50%">
      <stop offset="45%" stop-color="#6C7CFF" stop-opacity="0"/>
      <stop offset="100%" stop-color="#6C7CFF" stop-opacity="0.22"/>
    </radialGradient>
    <marker id="mp" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#A594F9"/>
    </marker>
    <marker id="ma" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#F0B44A"/>
    </marker>
    <filter id="dot" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .num { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 18px; fill: #8B95A1; }
      .name { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 20px; font-weight: 600; fill: #86E1A5; }
      .path { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; fill: #8B95A1; }
      .desc { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 13px; fill: #B4BEC9; }
      .edge { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; letter-spacing: 0.08em; }
      .stat { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px; fill: #8B95A1; }
      .pill { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; fill: #B4BEC9; }
      @media (prefers-reduced-motion: reduce) {
        .comet, .pulse { display: none; }
      }
    </style>
  </defs>

  <rect width="1120" height="520" rx="12" fill="#0D1117"/>

  <text class="stat" x="36" y="40">pgbx</text>
  <text class="stat" x="84" y="40" fill="#5E6875">|</text>
  <text class="stat" x="100" y="40" fill="#86E1A5">inside Postgres</text>
  <text class="stat" x="232" y="40" fill="#5E6875">|</text>
  <text class="stat" x="248" y="40" fill="#86E1A5">backup to S3</text>
  <text class="stat" x="358" y="40" fill="#5E6875">|</text>
  <text class="stat" x="374" y="40" fill="#86E1A5">restore</text>
  <text class="stat" x="1084" y="40" text-anchor="end" fill="#F0B44A">still works when the server is down</text>

  <!-- edges under the cards -->
  <path id="e-created" d="M248 214 C 290 214, 300 248, 308 248" fill="none" stroke="#A594F9" stroke-width="2" marker-end="url(#mp)"/>
  <path id="e-backup" d="M490 216 C 580 160, 660 122, 748 122" fill="none" stroke="#A594F9" stroke-width="2" marker-end="url(#mp)"/>
  <path id="e-sql" d="M900 178 L 900 248" fill="none" stroke="#A594F9" stroke-width="2" marker-end="url(#mp)"/>
  <path id="e-down" d="M820 178 C 820 280, 790 340, 790 394" fill="none" stroke="#F0B44A" stroke-width="2" marker-end="url(#ma)"/>
  <path id="e-restore" d="M790 430 C 790 470, 975 470, 975 356" fill="none" stroke="#F0B44A" stroke-width="2" marker-end="url(#ma)"/>

  <text class="edge" x="268" y="198" fill="#A594F9">created</text>
  <text class="edge" x="590" y="148" fill="#A594F9">backs up</text>
  <text class="edge" x="912" y="220" fill="#A594F9">SQL</text>
  <text class="edge" x="748" y="290" fill="#F0B44A">server down</text>
  <text class="edge" x="860" y="492" fill="#F0B44A">restore</text>

  <!-- 01 new database -->
  <g>
    <rect x="28" y="160" width="220" height="108" rx="10" fill="#151A21" stroke="#2A323D"/>
    <text class="num" x="46" y="192">01</text>
    <text class="name" x="46" y="220">New database</text>
    <text class="path" x="46" y="244">CREATE DATABASE</text>
  </g>

  <!-- hub: Postgres, pgbx inside -->
  <circle cx="400" cy="248" r="132" fill="url(#hubglow)"/>
  <circle class="pulse" cx="400" cy="248" r="96" fill="none" stroke="#A594F9" stroke-width="1.25">
    <animate attributeName="r" values="96;112;96" dur="3.6s" repeatCount="indefinite"/>
    <animate attributeName="stroke-opacity" values="0.5;0;0.5" dur="3.6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="400" cy="248" r="96" fill="#12161C" stroke="#A594F9" stroke-width="1.5"/>
  <text x="400" y="214" text-anchor="middle" class="path" fill="#A594F9" style="letter-spacing:.12em">LIVES HERE</text>
  <text x="400" y="248" text-anchor="middle" class="name" fill="#E6EDF3" style="font-size:26px">Postgres</text>
  <text x="400" y="274" text-anchor="middle" class="desc">pgbx inside</text>
  <text x="400" y="296" text-anchor="middle" class="path">template1</text>

  <!-- 02 S3 -->
  <g>
    <rect x="748" y="72" width="230" height="106" rx="10" fill="#151A21" stroke="#2A323D"/>
    <text class="num" x="766" y="104">02</text>
    <text class="name" x="766" y="132">S3</text>
    <text class="path" x="766" y="156">daily 02:00 · keep 14</text>
  </g>

  <!-- 03 new name -->
  <g>
    <rect x="860" y="248" width="230" height="108" rx="10" fill="#151A21" stroke="#2A323D"/>
    <text class="num" x="878" y="280">03</text>
    <text class="name" x="878" y="308">new name</text>
    <text class="path" x="878" y="332">pgbx.restore(into_db)</text>
  </g>

  <!-- 04 CLI -->
  <g>
    <rect x="560" y="340" width="230" height="108" rx="10" fill="#151A21" stroke="#2A323D"/>
    <text class="num" x="578" y="372">04</text>
    <text class="name" x="578" y="400">CLI</text>
    <text class="path" x="578" y="424">db-restore --from-s3</text>
  </g>

  <!-- comets -->
  <g class="comet" filter="url(#dot)">
    <circle r="4.2" fill="#C4B8FF">
      <animateMotion dur="2.8s" repeatCount="indefinite" begin="0s"><mpath href="#e-created"/></animateMotion>
    </circle>
    <circle r="4.2" fill="#C4B8FF">
      <animateMotion dur="3.2s" repeatCount="indefinite" begin="0.2s"><mpath href="#e-backup"/></animateMotion>
    </circle>
    <circle r="4.2" fill="#C4B8FF">
      <animateMotion dur="3.2s" repeatCount="indefinite" begin="1.6s"><mpath href="#e-backup"/></animateMotion>
    </circle>
    <circle r="4.2" fill="#C4B8FF">
      <animateMotion dur="2.6s" repeatCount="indefinite" begin="0.5s"><mpath href="#e-sql"/></animateMotion>
    </circle>
    <circle r="4.2" fill="#F0B44A">
      <animateMotion dur="2.4s" repeatCount="indefinite" begin="0.3s"><mpath href="#e-down"/></animateMotion>
    </circle>
    <circle r="4.2" fill="#F0B44A">
      <animateMotion dur="3s" repeatCount="indefinite" begin="0.8s"><mpath href="#e-restore"/></animateMotion>
    </circle>
  </g>
</svg>
