[package]
name = "pgbx"
version = "0.6.0"
edition = "2021"
description = "CLI for pgbx: per-database backups from SQL, diagnosis when Postgres is down, restore from S3 onto a new server"

# standalone: not part of the pgrx extension crate in the parent directory
[workspace]

[[bin]]
name = "pgbx"
path = "src/main.rs"

[dependencies]
postgres = "0.19"
serde_json = "1"
rust-s3 = { version = "0.37", default-features = false, features = ["sync-rustls-tls"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# 0.6: encryption (ring), roles file + WAL/base backups (zstd), PITR checksums (sha2) and base.tar (tar)
ring = "0.17"
zstd = { version = "0.13", features = ["zstdmt"] }
sha2 = "0.10"
tar = { version = "0.4", default-features = false }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
opt-level = 3
