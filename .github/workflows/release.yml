name: Release

# Manual only: Actions -> Release -> Run workflow with an existing tag vX.Y.Z -> builds every artifact below and publishes a GitHub Release with SHA256SUMS.
#   pgbx-ext-pg<N>-linux-<arch>.tar.gz   extension: lib/<name>.so + extension/<name>.control + all sql (incl. upgrades)
#   pgbx-linux-<arch>.tar.gz             CLI, static musl binary
#   pgbx-darwin-arm64.tar.gz             CLI only (the extension is Linux-only)
#   pgbx-windows-<arch>.zip              CLI only, pgbx.exe
# Asset names carry NO version, so installers use the stable redirect
#   https://github.com/deemwar-products/pgbx/releases/latest/download/<asset>   (no API call, no rate limit)
# and a pinned release is .../releases/download/<tag>/<asset>. Each archive holds a VERSION file.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'existing tag to (re)build, e.g. v0.5.0'
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}
  CARGO_TERM_COLOR: always

jobs:
  extension:
    name: ext pg${{ matrix.pg }} ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        pg: [13, 14, 15, 16, 17, 18]
        arch: [amd64, arm64]
    # 22.04 = glibc 2.35: the .so then loads on Debian 12 / Ubuntu 22.04+ (built on 24.04 it needed GLIBC_2.38)
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-22.04-arm' || 'ubuntu-22.04' }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: '${{ env.TAG }}' }
      - name: PostgreSQL ${{ matrix.pg }} dev headers (PGDG)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq curl ca-certificates gnupg build-essential libclang-dev clang pkg-config
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-${{ matrix.pg }} postgresql-server-dev-${{ matrix.pg }}   # pgrx init runs initdb
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { key: 'pg${{ matrix.pg }}' }
      - name: cargo-pgrx (version pinned in Cargo.toml)
        run: |
          PGRX=$(sed -n 's/^pgrx = "=\{0,1\}\([0-9.]*\)".*/\1/p' Cargo.toml | head -1)
          echo "pgrx $PGRX"
          cargo install --locked cargo-pgrx --version "$PGRX"
      - name: Package
        run: |
          PGC=/usr/lib/postgresql/${{ matrix.pg }}/bin/pg_config
          cargo pgrx init --pg${{ matrix.pg }} "$PGC"
          cargo pgrx package --pg-config "$PGC" --no-default-features --features pg${{ matrix.pg }}
          VER=${TAG#v}
          NAME=pgbx-ext-pg${{ matrix.pg }}-linux-${{ matrix.arch }}
          OUT=dist/$NAME; mkdir -p "$OUT/lib" "$OUT/extension"
          PKG=$(ls -d target/release/*-pg${{ matrix.pg }})
          cp "$PKG"/usr/lib/postgresql/${{ matrix.pg }}/lib/*.so "$OUT/lib/"
          cp "$PKG"/usr/share/postgresql/${{ matrix.pg }}/extension/* "$OUT/extension/"
          # upgrade scripts (pgrx only generates the base install script)
          [ -d sql ] && cp sql/*.sql "$OUT/extension/" || true
          echo "$VER" > "$OUT/VERSION"
          ls -R "$OUT"
          tar -C dist -czf "dist/$NAME.tar.gz" "$NAME"
      - uses: actions/upload-artifact@v4
        with: { name: 'ext-pg${{ matrix.pg }}-${{ matrix.arch }}', path: 'dist/*.tar.gz' }

  cli-unix:
    name: pgbx ${{ matrix.os }}-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: linux, arch: amd64, runner: ubuntu-24.04, target: x86_64-unknown-linux-musl }
          - { os: linux, arch: arm64, runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl }
          # macOS builds run on our own Mac (self-hosted runner label pgbx-mac); Apple silicon only (Intel Macs: build from source)
          - { os: darwin, arch: arm64, runner: pgbx-mac, target: aarch64-apple-darwin }
    runs-on: ${{ matrix.runner == 'pgbx-mac' && fromJSON('["self-hosted","pgbx-mac"]') || matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: '${{ env.TAG }}' }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: '${{ matrix.target }}' }
      - if: matrix.os == 'linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq musl-tools
      - name: "Build (static on Linux: musl, no OpenSSL — TLS to Postgres and S3 is rustls)"
        run: |
          cargo test --locked --manifest-path cli/Cargo.toml
          cargo build --release --locked --manifest-path cli/Cargo.toml --target ${{ matrix.target }}
          VER=${TAG#v}
          NAME=pgbx-${{ matrix.os }}-${{ matrix.arch }}
          mkdir -p "dist/$NAME"
          cp cli/target/${{ matrix.target }}/release/pgbx "dist/$NAME/"
          cp LICENSE "dist/$NAME/" 2>/dev/null || true
          echo "$VER" > "dist/$NAME/VERSION"
          # the example connection adapters (ADR 0003; Node scripts, not part of the binary)
          mkdir -p "dist/$NAME/adapters" && cp -R adapters/README.md adapters/lib adapters/ssh adapters/aws adapters/gcp adapters/azure "dist/$NAME/adapters/"
          "dist/$NAME/pgbx" --version
          tar -C dist -czf "dist/$NAME.tar.gz" "$NAME"
      - uses: actions/upload-artifact@v4
        with: { name: 'cli-${{ matrix.os }}-${{ matrix.arch }}', path: 'dist/*.tar.gz' }

  cli-windows:
    # cross-compiled on Linux with cargo-xwin (MSVC CRT + SDK); the real-Windows check is install-test on our VM
    name: pgbx windows-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, target: x86_64-pc-windows-msvc }
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { ref: '${{ env.TAG }}' }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: '${{ matrix.target }}' }
      - name: Build
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq clang lld llvm zip
          cargo install --locked cargo-xwin
          # ring's C code must go through clang-cl: cargo-xwin passes MSVC-style flags (/imsvc ...) that plain clang rejects
          command -v clang-cl >/dev/null || sudo ln -sf "$(command -v clang)" /usr/local/bin/clang-cl
          export CC_x86_64_pc_windows_msvc=clang-cl
          # Windows on ARM runs this x64 exe through its built-in emulation; an aarch64 cross-build of ring + aws-lc fails
          cargo xwin build --release --locked --manifest-path cli/Cargo.toml --target ${{ matrix.target }}
          NAME=pgbx-windows-${{ matrix.arch }}
          mkdir -p "dist/$NAME"
          cp cli/target/${{ matrix.target }}/release/pgbx.exe "dist/$NAME/"
          cp LICENSE "dist/$NAME/" 2>/dev/null || true
          printf '%s' "${TAG#v}" > "dist/$NAME/VERSION"
          mkdir -p "dist/$NAME/adapters" && cp -R adapters/README.md adapters/lib adapters/ssh adapters/aws adapters/gcp adapters/azure "dist/$NAME/adapters/"
          (cd "dist/$NAME" && zip -q -r "../$NAME.zip" .)
      - uses: actions/upload-artifact@v4
        with: { name: 'cli-windows-${{ matrix.arch }}', path: 'dist/*.zip' }

  release:
    needs: [extension, cli-unix, cli-windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - run: cd dist && sha256sum pgbx-* > SHA256SUMS && cat SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          generate_release_notes: true
          files: |
            dist/pgbx-*
            dist/SHA256SUMS
